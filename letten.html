<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Oberer Letten · Live</title>
<style>
  :root{
    --bg1:#dfe8f3; --bg2:#a8bfd5; --fg:#0d1724; --muted:rgba(13,23,36,.58);
    --glass:rgba(255,255,255,.32); --line:rgba(255,255,255,.46); --shadow:0 24px 70px rgba(28,54,84,.22);
    --good:#0b7a45; --warn:#9a5b00; --bad:#a83232;
  }
  *{box-sizing:border-box} body{margin:0;min-height:100svh;display:grid;place-items:center;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Arial,sans-serif;color:var(--fg);background:
    radial-gradient(circle at 18% 15%, rgba(255,255,255,.9), transparent 26%),
    radial-gradient(circle at 82% 20%, rgba(162,213,255,.75), transparent 28%),
    linear-gradient(135deg,var(--bg1),var(--bg2));overflow:hidden}
  body:before{content:"";position:fixed;inset:-20%;background:conic-gradient(from 120deg,rgba(255,255,255,.28),rgba(95,154,199,.2),rgba(255,255,255,.32),rgba(129,178,214,.22));filter:blur(50px);animation:drift 16s ease-in-out infinite alternate}
  @keyframes drift{to{transform:translate3d(4%,-3%,0) scale(1.05)}}
  main{width:min(560px,calc(100vw - 28px));position:relative;padding:18px;border:1px solid var(--line);border-radius:34px;background:var(--glass);box-shadow:var(--shadow);backdrop-filter:blur(28px) saturate(160%);-webkit-backdrop-filter:blur(28px) saturate(160%)}
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:2px 2px 14px}
  h1{font-size:22px;line-height:1;margin:0;letter-spacing:-.04em;font-weight:760}.sub{font-size:12px;color:var(--muted);margin-top:6px}.pill{font-size:12px;padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.35);border:1px solid rgba(255,255,255,.45);white-space:nowrap}
  .grid{display:grid;grid-template-columns:1.1fr .9fr;gap:10px}.card{min-height:112px;padding:15px;border-radius:25px;background:rgba(255,255,255,.28);border:1px solid rgba(255,255,255,.42);box-shadow:inset 0 1px 0 rgba(255,255,255,.45)}
  .wide{grid-column:1/-1;min-height:88px}.label{font-size:12px;color:var(--muted);margin-bottom:8px}.value{font-size:36px;line-height:.95;letter-spacing:-.06em;font-weight:780}.unit{font-size:16px;color:var(--muted);letter-spacing:-.02em}.status{font-size:31px;line-height:1;letter-spacing:-.055em;font-weight:760}.hint{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.25}.row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--muted);margin-right:7px}.good{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}.good .dot{background:var(--good)}.warn .dot{background:var(--warn)}.bad .dot{background:var(--bad)}
  footer{display:flex;justify-content:space-between;align-items:center;margin:12px 4px 0;font-size:11px;color:var(--muted)}button{border:0;border-radius:999px;padding:8px 11px;background:rgba(255,255,255,.38);color:var(--fg);font:inherit;font-size:12px;cursor:pointer}button:active{transform:translateY(1px)}
  @media(max-width:520px){.grid{grid-template-columns:1fr}.value{font-size:34px}.status{font-size:29px}main{border-radius:28px;padding:14px}.card{min-height:94px}}
</style>
</head>
<body>
<main aria-live="polite">
  <header>
    <div><h1>Oberer Letten</h1><div class="sub">Zürich · Live-Check</div></div>
    <div class="pill" id="clock">lädt …</div>
  </header>
  <section class="grid">
    <article class="card">
      <div class="label">Luft</div>
      <div class="value"><span id="air">—</span><span class="unit"> °C</span></div>
      <div class="hint" id="weatherText">Wetter Zürich</div>
    </article>
    <article class="card">
      <div class="label">Wasser</div>
      <div class="value"><span id="water">—</span><span class="unit"> °C</span></div>
      <div class="hint">Badi/Stadt Zürich, Fallback Limmat</div>
    </article>
    <article class="card wide">
      <div class="row"><div><div class="label">Badi</div><div class="status" id="open">—</div></div><div id="openDot" class="pill"><span class="dot"></span>Status</div></div>
    </article>
    <article class="card wide">
      <div class="row"><div><div class="label">Strömung</div><div class="status" id="flowText">—</div></div><div class="value" style="font-size:26px"><span id="flow">—</span><span class="unit"> m³/s</span></div></div>
      <div class="hint" id="flowHint">Limmat Zürich/Unterhard. Der Lettenkanal kann lokal abweichen.</div>
    </article>
  </section>
  <footer><span id="source">Live-Daten werden geladen.</span><button onclick="loadAll(true)">Aktualisieren</button></footer>
</main>
<script>
const $ = id => document.getElementById(id);
const CORS = url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
const badUrl = 'https://www.stadt-zuerich.ch/de/stadtleben/sport-und-erholung/sport-und-badeanlagen/sommerbaeder/oberer-letten.html';
const bathApi = 'https://www.stadt-zuerich.ch/stzh/bathdatadownload';
const limmatUrl = 'https://www.badi-info.ch/_temp/limmat-baden2.htm';
const weatherUrl = 'https://api.open-meteo.com/v1/forecast?latitude=47.3769&longitude=8.5417&current=temperature_2m,weather_code&timezone=Europe%2FZurich';

function now(){ $('clock').textContent = new Intl.DateTimeFormat('de-CH',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit'}).format(new Date()); }
function codeText(c){ const m={0:'klar',1:'meist klar',2:'teils bewölkt',3:'bewölkt',45:'Nebel',48:'Nebel',51:'Niesel',53:'Niesel',55:'Niesel',61:'Regen',63:'Regen',65:'starker Regen',71:'Schnee',80:'Schauer',95:'Gewitter'}; return m[c]||'Wetter'; }
async function getText(url){ try{let r=await fetch(url,{cache:'no-store'}); if(r.ok) return await r.text();}catch(e){} let r=await fetch(CORS(url),{cache:'no-store'}); if(!r.ok) throw new Error('fetch failed'); return await r.text(); }
async function loadWeather(){ const r=await fetch(weatherUrl,{cache:'no-store'}); const j=await r.json(); $('air').textContent=Math.round(j.current.temperature_2m); $('weatherText').textContent=codeText(j.current.weather_code); }
function parseBadi(html){ const text=html.replace(/<[^>]+>/g,' ').replace(/\s+/g,' '); const wt=(text.match(/Wassertemperatur\s*,?\s*(\d+(?:[.,]\d+)?)\s*°?\s*C/i)||text.match(/Wassertemperatur\s+(\d+(?:[.,]\d+)?)\s*°?\s*C/i)); const st=text.match(/Status\s*,?\s*(offen|geschlossen)/i); return {water:wt?wt[1].replace(',','.'):null, open:st?st[1].toLowerCase():null}; }
function parseLimmat(html){ const text=html.replace(/<[^>]+>/g,' ').replace(/\s+/g,' '); const temp=text.match(/Baden[^0-9]*(\d+(?:[.,]\d+)?)\s*°?C/i); const flow=text.match(/Abfluss[^0-9]*(\d+(?:[.,]\d+)?)\s*m/i); return {temp:temp?temp[1].replace(',','.'):null, flow:flow?flow[1].replace(',','.'):null}; }
function setOpen(v){ const dot=$('openDot'); dot.className='pill'; if(v==='offen'){ $('open').textContent='offen'; $('open').className='status good'; dot.classList.add('good'); dot.innerHTML='<span class="dot"></span>offen'; } else if(v==='geschlossen'){ $('open').textContent='geschlossen'; $('open').className='status bad'; dot.classList.add('bad'); dot.innerHTML='<span class="dot"></span>zu'; } else { $('open').textContent='unklar'; $('open').className='status warn'; dot.classList.add('warn'); dot.innerHTML='<span class="dot"></span>unklar'; }}
function flowLabel(q){ q=Number(q); if(!q) return 'unklar'; if(q<90) return 'ruhig'; if(q<160) return 'zügig'; if(q<350) return 'stark'; return 'sehr stark'; }
function flowClass(t){ return t==='ruhig'?'good':(t==='zügig'?'warn':(t==='unklar'?'warn':'bad')); }
async function loadBadiAndFlow(){
  let got=[];
  try{ const html=await getText(badUrl); const b=parseBadi(html); if(b.water){$('water').textContent=Math.round(Number(b.water)); got.push('Stadt Zürich');} setOpen(b.open); }catch(e){ setOpen(null); }
  try{ const h=await getText(limmatUrl); const l=parseLimmat(h); if($('water').textContent==='—' && l.temp){$('water').textContent=Math.round(Number(l.temp)); got.push('Limmat');} if(l.flow){$('flow').textContent=Math.round(Number(l.flow)); const t=flowLabel(l.flow); $('flowText').textContent=t; $('flowText').className='status '+flowClass(t); got.push('BAFU/Badi-Info');} }catch(e){ $('flowText').textContent='unklar'; $('flowText').className='status warn'; }
  $('source').textContent = got.length ? `Live: ${got.join(' · ')}` : 'Live-Abruf nicht verfügbar.';
}
async function loadAll(manual=false){ now(); $('source').textContent=manual?'aktualisiert …':'Live-Daten werden geladen.'; await Promise.allSettled([loadWeather(),loadBadiAndFlow()]); now(); }
loadAll(); setInterval(loadAll, 10*60*1000);
</script>
</body>
</html>
